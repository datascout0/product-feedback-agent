[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "product-feedback-agent"
version = "0.1.0"
description = "Evidence-backed product feedback-to-opportunity analysis agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "sentence-transformers>=5,<6",
    "chromadb>=1,<2",
    "mcp[cli]>=2,<3",
    "google-genai>=2,<3",
    "starlette>=1,<2",
    "uvicorn>=0.28,<1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10"
]

[project.scripts]
product-feedback-agent = "product_feedback_agent.orchestrator:main"
product-feedback-agent-github-action = "product_feedback_agent.github_action:main"
product-feedback-agent-api = "product_feedback_agent.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
